<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-labelledby="title">
  <title id="title">How I work with AI agents: tickets go to Claude Code agents running in parallel, each in its own git worktree; each turns its ticket into a pull request that is reviewed and tested; an orchestrator checks and merges.</title>
  <style>
@media (prefers-reduced-motion: reduce) {
  .draw, .ants, .bob, .caret, .flow { animation: none !important; }
}</style>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="20" y="44" width="260" height="128" rx="14" fill="#FFFFFF" stroke="#CBD7E6"/>
  <rect x="20" y="44" width="6" height="128" rx="3" fill="#0891B2"/>
  <text x="44" y="88" font-size="23" font-weight="700" fill="#0F172A">Tickets</text>
  <text x="44" y="122" font-size="18" fill="#4B5B73">one task each</text>
  <path d="M288 108.0 L310 108.0" stroke="#CBD7E6" stroke-width="2"/>
  <path d="M302 102.0 L310 108.0 L302 114.0" fill="none" stroke="#CBD7E6" stroke-width="2"/>
  <circle class="flow" r="4" cy="108.0" cx="288" fill="#0891B2"><animate attributeName="cx" from="288" to="306" dur="2.2s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="2.2s" begin="0.0s" repeatCount="indefinite"/></circle>
  <circle class="flow" r="4" cy="108.0" cx="288" fill="#0891B2"><animate attributeName="cx" from="288" to="306" dur="2.2s" begin="1.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="2.2s" begin="1.1s" repeatCount="indefinite"/></circle>
  <rect x="334" y="30" width="260" height="128" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-opacity="0.25"/>
  <rect x="327" y="37" width="260" height="128" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-opacity="0.50"/>
  <rect x="320" y="44" width="260" height="128" rx="14" fill="#FFFFFF" stroke="#CBD7E6"/>
  <rect x="320" y="44" width="6" height="128" rx="3" fill="#7C3AED"/>
  <text x="344" y="88" font-size="23" font-weight="700" fill="#0F172A">Claude Code agents</text>
  <text x="344" y="122" font-size="18" fill="#4B5B73">in parallel, each in</text>
  <text x="344" y="147" font-size="18" fill="#4B5B73">its own git worktree</text>
  <path d="M602 108.0 L610 108.0" stroke="#CBD7E6" stroke-width="2"/>
  <path d="M602 102.0 L610 108.0 L602 114.0" fill="none" stroke="#CBD7E6" stroke-width="2"/>
  <circle class="flow" r="4" cy="108.0" cx="602" fill="#7C3AED"><animate attributeName="cx" from="602" to="606" dur="2.2s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="2.2s" begin="0.4s" repeatCount="indefinite"/></circle>
  <circle class="flow" r="4" cy="108.0" cx="602" fill="#7C3AED"><animate attributeName="cx" from="602" to="606" dur="2.2s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="2.2s" begin="1.5s" repeatCount="indefinite"/></circle>
  <rect x="620" y="44" width="260" height="128" rx="14" fill="#FFFFFF" stroke="#CBD7E6"/>
  <rect x="620" y="44" width="6" height="128" rx="3" fill="#0891B2"/>
  <text x="644" y="88" font-size="23" font-weight="700" fill="#0F172A">Pull requests</text>
  <text x="644" y="122" font-size="18" fill="#4B5B73">reviewed and tested</text>
  <text x="644" y="147" font-size="18" fill="#4B5B73">before anything ships</text>
  <path d="M888 108.0 L910 108.0" stroke="#CBD7E6" stroke-width="2"/>
  <path d="M902 102.0 L910 108.0 L902 114.0" fill="none" stroke="#CBD7E6" stroke-width="2"/>
  <circle class="flow" r="4" cy="108.0" cx="888" fill="#0891B2"><animate attributeName="cx" from="888" to="906" dur="2.2s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="2.2s" begin="0.8s" repeatCount="indefinite"/></circle>
  <circle class="flow" r="4" cy="108.0" cx="888" fill="#0891B2"><animate attributeName="cx" from="888" to="906" dur="2.2s" begin="1.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="2.2s" begin="1.9s" repeatCount="indefinite"/></circle>
  <rect x="920" y="44" width="260" height="128" rx="14" fill="#FFFFFF" stroke="#CBD7E6"/>
  <rect x="920" y="44" width="6" height="128" rx="3" fill="#D97706"/>
  <text x="944" y="88" font-size="23" font-weight="700" fill="#0F172A">Orchestrator</text>
  <text x="944" y="122" font-size="18" fill="#4B5B73">checks and merges</text>
  </g>
</svg>
